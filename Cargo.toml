[workspace]
members = ["crates/core", "crates/web", "crates/application", "crates/native", "crates/hosts", "crates/cdp", "crates/platform-macos", "crates/cli", "crates/frida", "crates/electron-gadget", "crates/webkit", "crates/bootstrap", "crates/preparation"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
injectra-core = { path = "crates/core" }
injectra-web = { path = "crates/web" }
injectra-application = { path = "crates/application" }
injectra-cdp = { path = "crates/cdp" }
injectra-platform-macos = { path = "crates/platform-macos" }
injectra-native = { path = "crates/native" }
injectra-hosts = { path = "crates/hosts" }

injectra-frida = { path = "crates/frida" }
injectra-electron-gadget = { path = "crates/electron-gadget" }

injectra-webkit = { path = "crates/webkit" }

injectra-bootstrap = { path = "crates/bootstrap" }

injectra-preparation = { path = "crates/preparation" }
