[package]
name = "injectra-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "injectra"
path = "src/main.rs"

[dependencies]
injectra-core.workspace = true
injectra-application.workspace = true
injectra-web.workspace = true
injectra-cdp.workspace = true
injectra-hosts.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4.6", features = ["derive"] }

injectra-electron-gadget.workspace = true
injectra-webkit.workspace = true
injectra-frida.workspace = true

injectra-bootstrap.workspace = true
injectra-preparation.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "sync", "time"] }
axum = "0.8"
fs2 = "0.4"
libc = "0.2"
