[package]
name = "injectra-studio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
injectra-core.workspace = true
injectra-web.workspace = true
injectra-application.workspace = true
injectra-workspace.workspace = true
injectra-bootstrap.workspace = true
injectra-cdp.workspace = true
injectra-electron-gadget.workspace = true
injectra-webkit.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "signal", "macros"] }
tower-http = { version = "0.6", features = ["fs"] }
futures-util = "0.3"
getrandom = "0.4"
rustix = { version = "1.1", features = ["process"] }
sha2 = "0.10"
subtle = "2"
fs2 = "0.4"
libc = "0.2"
ureq = { version = "3", default-features = false, features = ["json"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.29"
